<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} | Shopee Clone</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-layout">
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" class="nav-brand" style="font-size: 2rem; margin-bottom: 16px; display: block;">ShopeeClone</a>
            <h1 class="auth-title">Đăng ký</h1>
            <p class="auth-subtitle">Trở thành thành viên để nhận hàng ngàn ưu đãi.</p>
        </div>

        <form action="/register" method="POST">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="Nhập email hợp lệ" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-input" placeholder="Ít nhất 6 ký tự" required>
            </div>
            <button type="submit" class="btn btn-primary w-full" style="padding: 16px;">Tạo tài khoản</button>
        </form>

        <p class="text-center mt-8" style="color: var(--text-muted);">
            Bạn đã có tài khoản? <a href="/login" style="color: var(--primary); font-weight: 600;">Đăng nhập</a>
        </p>
    </div>
</body>
</html>
