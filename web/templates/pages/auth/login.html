<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} | Shopee Clone</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-layout">
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" class="nav-brand" style="font-size: 2rem; margin-bottom: 16px; display: block;">ShopeeClone</a>
            <h1 class="auth-title">Đăng nhập</h1>
            <p class="auth-subtitle">Chào mừng bạn quay lại. Vui lòng đăng nhập để tiếp tục.</p>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label class="form-label">Email hoặc Số điện thoại</label>
                <input type="text" name="email" class="form-input" placeholder="Nhập email/SĐT của bạn" required>
            </div>
            <div class="form-group">
                <div class="flex justify-between items-center mb-2">
                    <label class="form-label" style="margin-bottom: 0;">Mật khẩu</label>
                    <a href="#" style="font-size: 0.875rem; color: var(--primary); font-weight: 500;">Quên mật khẩu?</a>
                </div>
                <input type="password" name="password" class="form-input" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-primary w-full" style="padding: 16px;">Đăng nhập</button>
        </form>

        <div class="auth-divider">Hoặc đăng nhập với</div>

        <div class="grid grid-cols-2 gap-4">
            <button class="btn btn-outline"><i class="ph-fill ph-google-logo" style="margin-right: 8px; color: #DB4437;"></i> Google</button>
            <button class="btn btn-outline"><i class="ph-fill ph-facebook-logo" style="margin-right: 8px; color: #4267B2;"></i> Facebook</button>
        </div>

        <p class="text-center mt-8" style="color: var(--text-muted);">
            Bạn chưa có tài khoản? <a href="/register" style="color: var(--primary); font-weight: 600;">Đăng ký ngay</a>
        </p>
    </div>
</body>
</html>
