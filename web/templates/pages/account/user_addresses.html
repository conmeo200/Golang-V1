{{define "content"}}
<div class="container">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        {{template "sidebar_user" .}}

        <!-- Main Content -->
        <div class="dashboard-content">
            <div class="flex justify-between items-center mb-6">
                <h2 style="font-size: 1.5rem; font-weight: 700;">Địa chỉ của tôi</h2>
                <button class="btn btn-primary" style="padding: 8px 16px; font-size: 0.875rem;"><i class="ph ph-plus" style="margin-right: 8px;"></i> Thêm địa chỉ mới</button>
            </div>
            
            <div class="flex-col gap-4">
                {{range .Addresses}}
                <div style="padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-md); {{if .IsDefault}} border-left: 4px solid var(--primary); {{end}}">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div style="font-weight: 600; font-size: 1.125rem; display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                                {{.Name}} 
                                <span style="color: var(--text-muted); font-weight: 400; font-size: 1rem;">| {{.Phone}}</span>
                                {{if .IsDefault}}
                                <span class="status-badge" style="background: rgba(79, 70, 229, 0.1); color: var(--primary);">Mặc định</span>
                                {{end}}
                            </div>
                            <div style="color: var(--text-muted); line-height: 1.5;">{{.Address}}</div>
                        </div>
                        <div class="flex gap-2">
                            <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.875rem;">Cập nhật</button>
                            <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.875rem; color: #EF4444; border-color: #EF4444;">Xóa</button>
                        </div>
                    </div>
                </div>
                {{end}}
            </div>
        </div>
    </div>
</div>
{{end}}
