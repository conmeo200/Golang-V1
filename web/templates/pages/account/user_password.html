{{define "content"}}
<div class="container">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        {{template "sidebar_user" .}}

        <!-- Main Content -->
        <div class="dashboard-content">
            <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 24px;">Đổi mật khẩu</h2>
            
            <div style="max-width: 500px;">
                <form>
                    <div class="form-group">
                        <label class="form-label">Mật khẩu hiện tại</label>
                        <input type="password" class="form-input" placeholder="Nhập mật khẩu hiện tại">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mật khẩu mới</label>
                        <input type="password" class="form-input" placeholder="Nhập mật khẩu mới">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Xác nhận mật khẩu mới</label>
                        <input type="password" class="form-input" placeholder="Nhập lại mật khẩu mới">
                    </div>
                    <button type="button" class="btn btn-primary mt-4">Lưu thay đổi</button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
