{{define "content"}}
<div class="container">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        {{template "sidebar_seller" .}}

        <!-- Main Content -->
        <div class="dashboard-content">
            <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 24px;">Thiết lập cửa hàng</h2>
            
            <div class="grid grid-cols-2 gap-12">
                <div>
                    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 16px;">Thông tin cơ bản</h3>
                    <form>
                        <div class="form-group">
                            <label class="form-label">Tên Shop</label>
                            <input type="text" class="form-input" value="{{.Seller.ShopName}}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Mô tả Shop</label>
                            <textarea class="form-input" rows="4">Chuyên cung cấp các sản phẩm thời trang và công nghệ chính hãng với giá tốt nhất.</textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email hỗ trợ</label>
                            <input type="email" class="form-input" value="support@astore.com">
                        </div>
                        <button type="button" class="btn btn-primary mt-4">Lưu thông tin</button>
                    </form>
                </div>

                <div>
                    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 16px;">Cài đặt vận chuyển</h3>
                    <div style="padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 16px;">
                        <div class="flex justify-between items-center mb-2">
                            <div style="font-weight: 600;">Giao Hàng Nhanh (GHN)</div>
                            <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: var(--primary);">
                        </div>
                        <p style="font-size: 0.875rem; color: var(--text-muted);">Đã liên kết thành công</p>
                    </div>
                    <div style="padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-md);">
                        <div class="flex justify-between items-center mb-2">
                            <div style="font-weight: 600;">Viettel Post</div>
                            <input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--primary);">
                        </div>
                        <p style="font-size: 0.875rem; color: var(--text-muted);">Chưa liên kết</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
