{{define "content"}}
<div class="container">
    <div class="flex items-center justify-between mt-8 mb-4">
        <h1 style="font-size: 2rem; font-weight: 700;">Thời trang Nam</h1>
        <div class="flex items-center gap-4">
            <span style="color: var(--text-muted);">Sắp xếp theo:</span>
            <select class="form-input" style="width: auto; padding: 8px 16px; border-radius: var(--radius-full);">
                <option>Mới nhất</option>
                <option>Bán chạy</option>
                <option>Giá: Thấp đến Cao</option>
                <option>Giá: Cao đến Thấp</option>
            </select>
        </div>
    </div>

    <div class="category-layout">
        <!-- Filters -->
        <div class="filter-sidebar">
            <div class="filter-group">
                <div class="filter-title">Đánh giá</div>
                <label class="filter-checkbox"><input type="checkbox"> Từ 4 sao trở lên</label>
                <label class="filter-checkbox"><input type="checkbox"> Từ 3 sao trở lên</label>
            </div>

            <div class="filter-group">
                <div class="filter-title">Khoảng giá</div>
                <div class="flex gap-2 items-center mb-2">
                    <input type="number" class="form-input" placeholder="Từ" style="padding: 8px;">
                    <span>-</span>
                    <input type="number" class="form-input" placeholder="Đến" style="padding: 8px;">
                </div>
                <button class="btn btn-primary w-full" style="padding: 8px;">Áp dụng</button>
            </div>

            <div class="filter-group">
                <div class="filter-title">Dịch vụ & Khuyến mãi</div>
                <label class="filter-checkbox"><input type="checkbox"> Freeship Extra</label>
                <label class="filter-checkbox"><input type="checkbox"> Đang giảm giá</label>
                <label class="filter-checkbox"><input type="checkbox"> Hàng Quốc tế</label>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="grid grid-cols-3 gap-6">
            {{range .Products}}
            <div class="product-card">
                <a href="/product/1" class="product-image-wrap">
                    <img src="{{if .Image}}{{.Image}}{{else}}https://via.placeholder.com/300/f3f4f6/374151?text={{.Name}}{{end}}" alt="{{.Name}}" class="product-image">
                </a>
                <div class="product-info">
                    <a href="/product/1" class="product-title">{{.Name}}</a>
                    <div class="product-meta">
                        <span class="product-price">{{.Price}}</span>
                        <span class="product-sold">{{.Sold}}</span>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
    </div>
    
    <!-- Pagination Mock -->
    <div class="flex justify-center mt-8 mb-8">
        <div class="flex gap-2">
            <button class="btn btn-outline" style="padding: 8px 16px;"><i class="ph ph-caret-left"></i></button>
            <button class="btn btn-primary" style="padding: 8px 16px;">1</button>
            <button class="btn btn-outline" style="padding: 8px 16px;">2</button>
            <button class="btn btn-outline" style="padding: 8px 16px;">3</button>
            <button class="btn btn-outline" style="padding: 8px 16px;"><i class="ph ph-caret-right"></i></button>
        </div>
    </div>
</div>
{{end}}
