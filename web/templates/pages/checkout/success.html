{{define "content"}}
<div class="container">
    <div class="success-layout">
        <div class="success-icon">
            <i class="ph ph-check"></i>
        </div>
        <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 16px;">Đặt hàng thành công!</h1>
        <p style="color: var(--text-muted); font-size: 1.125rem;">Cảm ơn bạn đã mua sắm tại ShopeeClone. Đơn hàng của bạn đang được xử lý.</p>

        <div class="order-box">
            <div class="flex justify-between mb-2">
                <span style="color: var(--text-muted);">Mã đơn hàng:</span>
                <span style="font-weight: 600;">#ORD-2026-8899</span>
            </div>
            <div class="flex justify-between mb-2">
                <span style="color: var(--text-muted);">Tổng thanh toán:</span>
                <span style="font-weight: 700; color: var(--primary);">850.000đ</span>
            </div>
            <div class="flex justify-between">
                <span style="color: var(--text-muted);">Phương thức:</span>
                <span style="font-weight: 600;">Thanh toán khi nhận hàng</span>
            </div>
        </div>

        <div class="flex gap-4">
            <a href="/account/user" class="btn btn-outline">Xem đơn hàng</a>
            <a href="/" class="btn btn-primary">Tiếp tục mua sắm <i class="ph ph-arrow-right" style="margin-left: 8px;"></i></a>
        </div>
    </div>
</div>
{{end}}
